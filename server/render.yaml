services:
  - type: web
    name: lms-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          name: lms-redis
          type: redis
          property: connectionString
      - key: NODE_ENV
        value: production

  - type: redis
    name: lms-redis
    plan: free
    maxmemoryPolicy: noeviction