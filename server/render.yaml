services: 
  - type: web
    name: lms-api
    runtime: docker
    dockerfilePath: ./dockerfile
    envVars:
     -  key: REDIS_URL
        fromService: 
               name: lms-redis
               type: redis
               property: connectionString
     -   key: NODE_ENV 
         value: production
     -   key : PORT
         value: 5000
  - type: redis
    name: lms-redis
    plan: free 
    maxmemoryPolicy: noeviction